# Override load test : gunicorn multi-worker au lieu de manage.py runserver
# Usage : docker compose -f docker-compose.yml -f docker-compose.loadtest.yml --profile loadtest up --build
services:
  backend:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.loadtest
    command: "sh -c 'python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 8 --threads 4 --timeout 120'"
