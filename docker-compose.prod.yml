services:

  # ── Base de données ───────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always                      # redémarre automatiquement si crash
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Backend Django ────────────────────────────────
  backend:
    image: ${DOCKER_USERNAME}/xakilo-backend:latest  # image depuis Docker Hub
    restart: always
    volumes:
      - static_files:/app/staticfiles    # fichiers statiques partagés avec Nginx
      - media_files:/app/media           # fichiers uploadés
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application
             --bind 0.0.0.0:8000
             --workers 4
             --timeout 120"

  # ── Celery (tâches asynchrones) ───────────────────
  celery:
    image: ${DOCKER_USERNAME}/xakilo-backend:latest  # même image que backend
    restart: always
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker --loglevel=info --concurrency=4

  # ── Nginx (reverse proxy + sert le frontend) ──────
  nginx:
    image: ${DOCKER_USERNAME}/xakilo-frontend:latest  # frontend buildé dans l'image
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  static_files:
  media_files: