name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:

  # Tests Backend 
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: xakilo_test
          POSTGRES_USER: xakilo_user
          POSTGRES_PASSWORD: xakilo_pass
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: get the code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt

      - name: install depandences
        run: pip install -r requirements/dev.txt

      - name: Lint (Ruff)
        run: ruff check .

      - name: start tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DJANGO_SECRET_KEY: ci-secret-key-not-for-production
          POSTGRES_DB: xakilo_test
          POSTGRES_USER: xakilo_user
          POSTGRES_PASSWORD: xakilo_pass
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest --cov=. --cov-report=xml -v || CODE=$?
          [ "${CODE:-0}" -eq 5 ] && echo "Aucun test collecté." && exit 0
          exit ${CODE:-0}

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend

  # Tests Frontend 
  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: get the code
        uses: actions/checkout@v4

      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install depandences
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: verify typescript
        run: npm run type-check

      - name: start tests
        run: npm run test

      - name: verify buid in prod
        run: npm run build